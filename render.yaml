services:
  - type: web
    name: citisevik-demo
    runtime: python
    plan: free
    buildCommand: pip install -r app/backend/requirements.txt
    startCommand: uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
